server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # los archivos con hash se pueden cachear harto tiempo
    location ~* \.(js|css|woff2?|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # cualquier otra ruta la resuelve el router de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
